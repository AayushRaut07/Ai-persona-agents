# A vocabulary style: the WORDS this person reaches for.
# Sets formality, typos and adds to the habit pool. A persona has one of these.

name: professional

formality: 0.7          # 0.0 = very casual, 1.0 = very formal
typos: 0.0              # 0.0 = none, 1.0 = frequent

habits_per_person: 2
habits:
  - refers to past experience with "seen this before"
  - mentions a concrete number or timeframe
